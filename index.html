  :root{
    --ink:#2a160a; --sun:#ffd23f; --red:#e4572e; --blue:#2f80c9; --orange:#ff8c2b; --green:#3fbf6a;
    --card:rgba(255,246,226,0.97);
    --o2:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink);
    --o3:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe0f5;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:600;color:var(--ink);}
  body{position:fixed;inset:0;}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;}
  button{font:inherit;cursor:pointer;touch-action:manipulation;}
  .hidden{display:none !important;}

  /* ---------- labels & popups projected from 3D ---------- */
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .tag{position:absolute;left:0;top:0;font-weight:800;font-size:12px;color:#fff;white-space:nowrap;text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8);will-change:transform;}
  .tag.me{color:var(--sun);}
  .tag .st{display:block;font-weight:800;color:#ff7a45;}
  .tag .bang{display:block;color:#ff3b3b;font-size:26px;font-weight:800;line-height:1;}
  .tag .warn{display:block;color:#fff;background:#e4572e;border-radius:6px;padding:1px 6px;font-size:13px;font-weight:800;}
  .pop{position:absolute;left:0;top:0;font-family:"Titan One","Titan One","Arial Black",sans-serif;font-weight:800;font-size:21px;color:#fff;
    text-shadow:var(--o2);white-space:nowrap;letter-spacing:.5px;will-change:transform,opacity;}
  .pop.paf{font-size:36px;color:var(--sun);}
  .pop.gold{color:var(--sun);}
  .pop.small{font-size:14px;}

  /* ---------- HUD ---------- */
  #hud,#hint,#actions,#stickZone{display:none;}
  body.ingame #hud{display:flex;}
  body.menu-open #hudScores,body.menu-open #hint{visibility:hidden;}
  body.ingame #hint{display:block;}
  body.ingame #actions{display:block;}
  body.ingame.touch #stickZone{display:block;}
  #hud{position:absolute;left:0;right:0;top:0;flex-direction:column;gap:6px;pointer-events:none;
    padding:calc(8px + var(--sat)) calc(10px + var(--sar)) 0 calc(10px + var(--sal));}
  .hud-row{display:flex;align-items:flex-start;gap:8px;}
  .hud-box{background:rgba(42,22,10,0.74);color:#fff;border-radius:12px;padding:6px 10px;box-shadow:0 2px 0 rgba(0,0,0,.25);}
  #hudRoundBox{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:96px;}
  #hudRound{font-weight:800;font-size:12px;letter-spacing:.6px;opacity:.9;white-space:nowrap;}
  .pill{font-weight:800;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sun);color:var(--ink);letter-spacing:.5px;white-space:nowrap;}
  #hudObjBox{flex:1;text-align:center;min-width:0;}
  #hudObjective{font-weight:800;font-size:clamp(13px,2.1vw,18px);line-height:1.2;}
  #hudTimer{font-weight:800;font-size:13px;color:var(--sun);}
  #hudBtns{display:flex;gap:6px;pointer-events:auto;}
  .icon-btn{width:40px;height:40px;border-radius:12px;border:none;background:rgba(42,22,10,0.74);color:#fff;
    font-size:16px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:0;}
  #hudScores{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;}
  .chip{display:flex;align-items:center;gap:5px;background:rgba(255,246,226,0.92);border-radius:999px;
    padding:3px 9px 3px 4px;font-weight:800;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.2);}
  .chip i,.res-table i{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid rgba(0,0,0,.3);vertical-align:-2px;}
  .chip.me{outline:2px solid var(--ink);}
  .scoreboard{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .scoreboard span{padding:4px 12px;font-size:16px;}
  .scoreboard .b{background:var(--blue);color:#fff;} .scoreboard .o{background:var(--orange);color:#fff;}
  .scoreboard .c{background:rgba(255,246,226,0.95);color:var(--ink);}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));
    background:rgba(42,22,10,0.78);color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;
    pointer-events:none;max-width:min(64vw,620px);text-align:center;line-height:1.3;}
  #hint.warn{background:var(--red);font-size:15px;}
  body.touch #hint{bottom:calc(196px + var(--sab));max-width:92vw;}

  /* ---------- banner & toast ---------- */
  #banner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;width:96vw;}
  #banner.show{animation:bannerPop var(--dur,1.6s) ease-out forwards;}
  #bannerText{font-family:"Titan One","Titan One","Arial Black",sans-serif;font-weight:800;font-size:clamp(40px,11vw,116px);line-height:1;
    color:var(--sun);text-shadow:var(--o3),0 7px 0 var(--ink);transform:rotate(-3deg);letter-spacing:1px;}
  #bannerSub{margin-top:14px;font-weight:800;font-size:clamp(15px,3vw,24px);color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px rgba(0,0,0,.6);}
  @keyframes bannerPop{
    0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
    12%{transform:translate(-50%,-50%) scale(1.12);opacity:1}
    20%{transform:translate(-50%,-50%) scale(1)}
    82%{opacity:1}
    100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
  #toast{position:absolute;left:50%;top:calc(104px + var(--sat));transform:translateX(-50%);background:var(--sun);color:var(--ink);
    font-weight:800;font-size:16px;padding:6px 14px;border-radius:999px;border:3px solid var(--ink);pointer-events:none;
    box-shadow:0 3px 0 var(--ink);transition:opacity .3s;opacity:0;white-space:nowrap;}
  #toast.show{opacity:1;}

  /* ---------- controls ---------- */
  #stickZone{position:absolute;left:0;bottom:0;width:52%;height:60%;touch-action:none;}
  #stickBase{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;left:92px;top:calc(100% - 104px);
    background:rgba(255,246,226,0.2);border:3px solid rgba(255,246,226,0.65);pointer-events:none;}
  #stickKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    background:rgba(255,246,226,0.9);box-shadow:0 3px 0 rgba(0,0,0,.25);}
  #actions{position:absolute;right:calc(14px + var(--sar));bottom:calc(16px + var(--sab));width:230px;height:190px;pointer-events:none;}
  .act{position:absolute;border-radius:50%;border:4px solid #fff;color:#fff;font-weight:800;letter-spacing:.3px;
    box-shadow:0 5px 0 rgba(0,0,0,.3);touch-action:none;pointer-events:auto;display:flex;flex-direction:column;
    align-items:center;justify-content:center;line-height:1.05;padding:0 4px;text-align:center;}
  .act small{font-size:11px;opacity:.85;font-weight:800;}
  .act.pressed{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
  #btnA{right:0;bottom:0;width:108px;height:108px;background:var(--red);font-size:15px;}
  #btnB{right:118px;bottom:6px;width:82px;height:82px;background:var(--blue);font-size:12px;}
  #btnC{right:44px;bottom:118px;width:78px;height:78px;background:#7b4fd6;font-size:12px;}
  body:not(.touch) #actions{transform:scale(.82);transform-origin:bottom right;}
  body.touch .act small{display:none;}

  /* ---------- overlays ---------- */
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(42,22,10,0.28);
    padding:calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));}
  .card{background:var(--card);border-radius:22px;padding:20px 22px;max-width:600px;width:100%;max-height:100%;overflow:auto;
    border:3px solid var(--ink);box-shadow:0 8px 0 rgba(42,22,10,.35),0 20px 50px rgba(0,0,0,.3);text-align:center;
    touch-action:pan-y;-webkit-overflow-scrolling:touch;position:relative;}
  .logo{font-family:"Titan One","Titan One","Arial Black",sans-serif;font-weight:800;font-size:clamp(40px,9vw,74px);line-height:.95;
    color:var(--sun);text-shadow:var(--o3),0 6px 0 var(--ink);transform:rotate(-3deg);margin:6px 0 12px;letter-spacing:1px;}
  .logo span{display:block;color:#fff;font-size:.42em;letter-spacing:3px;margin-top:6px;text-shadow:var(--o2),0 4px 0 var(--ink);}
  .langs{display:flex;gap:6px;justify-content:center;margin-bottom:6px;}
  .langs button{border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:800;font-size:13px;padding:4px 12px;}
  .langs button.on{background:var(--ink);color:var(--sun);}
  .card-corner{position:absolute;top:10px;right:10px;}
  .card-corner .icon-btn{width:36px;height:36px;}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .mode{border:3px solid var(--ink);border-radius:16px;padding:12px 10px;background:#fff;box-shadow:0 4px 0 var(--ink);text-align:left;}
  .mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
  .mode b{display:block;font-family:"Titan One","Arial Black",sans-serif;font-weight:400;font-size:20px;letter-spacing:.5px;}
  .mode span{display:block;font-size:13px;font-weight:700;opacity:.8;margin-top:3px;}
  .mode.t{background:#fff3c4;} .mode.p{background:#d6ecff;}
  @media (max-width:420px){.modes{grid-template-columns:1fr;}}
  .small{font-size:13px;opacity:.8;margin:12px 0 0;}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .btn{border:3px solid var(--ink);border-radius:14px;padding:11px 18px;font-weight:800;font-size:16px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
  .btn.primary{background:var(--sun);}
  h2{font-family:"Titan One","Titan One","Arial Black",sans-serif;font-size:clamp(30px,7vw,50px);margin:4px 0 8px;text-shadow:var(--o2),0 4px 0 var(--ink);letter-spacing:1px;line-height:1.1;color:var(--sun);}
  .kicker{font-weight:800;font-size:13px;letter-spacing:1px;opacity:.7;}
  .desc{font-weight:700;margin:4px 0;}
  .you-line{font-weight:800;font-size:17px;margin:10px 0 8px;padding:6px 10px;border-radius:10px;background:rgba(42,22,10,.07);}
  .you-line.good{background:rgba(63,191,106,.22);} .you-line.bad{background:rgba(228,87,46,.18);}
  .res-table{margin:6px auto 0;border-collapse:collapse;font-weight:700;min-width:260px;}
  .res-table th{font-size:12px;opacity:.7;padding:3px 10px;}
  .res-table td{padding:5px 10px;border-top:1px solid rgba(42,22,10,.15);text-align:left;}
  .res-table td:nth-child(n+3){text-align:center;}
  .res-table tr.me td{background:rgba(255,210,63,.35);}
  .help{text-align:left;font-size:15px;line-height:1.45;}
  .help h3{margin:14px 0 4px;font-size:17px;}
  .help ul{margin:4px 0;padding-left:20px;}
  .help li{margin:3px 0;}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;}
  .keys b{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 6px;white-space:nowrap;}
  .inapp{margin-top:10px;padding:8px 10px;border-radius:12px;background:#ffe7c2;border:2px dashed var(--ink);font-weight:800;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .inapp .btn{padding:6px 12px;font-size:14px;text-decoration:none;}
  .rotate-ico{font-size:54px;line-height:1;margin:4px 0;display:inline-block;animation:rot 1.8s ease-in-out infinite;}
  @keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}

  /* ---------- short landscape screens (phones on their side) ---------- */
  @media (max-height:520px) and (orientation:landscape){
    .card{padding:10px 16px;border-radius:16px;max-width:840px;}
    .logo{font-size:36px;margin:2px 0 6px;text-shadow:var(--o2),0 4px 0 var(--ink);}
    .desc{font-size:14px;margin:2px 0;}
    h2{font-size:30px;margin:0 0 2px;}
    .help h2{font-size:26px;}
    .btns{margin-top:8px;gap:8px;}
    .btn{padding:7px 14px;font-size:14px;box-shadow:0 3px 0 var(--ink);}
    .modes{margin-top:6px;gap:8px;}
    .mode{padding:7px 10px;} .mode b{font-size:16px;} .mode span{font-size:12px;}
    .small{margin-top:6px;font-size:12px;}
    .help{font-size:14px;}
    .result-card{display:grid;grid-template-columns:1.1fr 1fr;gap:4px 18px;align-items:center;text-align:left;}
    .result-card .you-line{font-size:15px;margin:6px 0;}
    .result-card .res-table{font-size:14px;min-width:0;width:100%;margin:0;}
    .result-card .res-table td{padding:3px 8px;}
    .result-card .btns{justify-content:flex-start;}
    #hud{padding-top:calc(4px + var(--sat));gap:4px;}
    .hud-box{padding:4px 8px;border-radius:10px;}
    #hudObjective{font-size:13px;} #hudTimer{font-size:12px;}
    .icon-btn{width:34px;height:34px;font-size:14px;border-radius:10px;}
    .chip{font-size:11px;padding:2px 7px 2px 3px;}
    .scoreboard span{padding:2px 10px;font-size:14px;}
    #actions{transform:scale(.8);transform-origin:bottom right;}
    body.touch #hint{bottom:calc(8px + var(--sab));max-width:40vw;font-size:12px;}
    #hint.warn{font-size:13px;}
    #toast{top:calc(78px + var(--sat));font-size:14px;}
    #stickBase{width:112px;height:112px;margin:-56px 0 0 -56px;}
    #bannerSub{margin-top:8px;}
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Tshobo Frappe 3D"></canvas>
<div id="labels"></div>

<div id="hud">
  <div class="hud-row">
    <div class="hud-box" id="hudRoundBox"><div id="hudRound"></div><div class="pill" id="hudPhase"></div></div>
    <div class="hud-box" id="hudObjBox"><div id="hudObjective"></div><div id="hudTimer"></div></div>
    <div id="hudBtns">
      <button class="icon-btn fs-btn" id="btnFull" aria-label="Full screen">⛶</button>
      <button class="icon-btn" id="btnPause" aria-label="Pause">❚❚</button>
      <button class="icon-btn" id="btnMute" aria-label="Sound">🔊</button>
    </div>
  </div>
  <div id="hudScores"></div>
</div>
<div id="banner"><div id="bannerText"></div><div id="bannerSub"></div></div>
<div id="toast"></div>
<div id="hint"></div>

<div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
<div id="actions">
  <button class="act" id="btnA"><span>A</span><small>J / Space</small></button>
  <button class="act" id="btnB"><span>B</span><small>K</small></button>
  <button class="act" id="btnC"><span>C</span><small>L</small></button>
</div>

<!-- Title -->
<div class="overlay" id="titleScreen">
  <div class="card">
    <div class="card-corner"><button class="icon-btn fs-btn" id="btnFullTitle" aria-label="Full screen">⛶</button></div>
    <div class="langs"><button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="ln">LN</button></div>
    <div class="logo">TSHOBO<span>FRAPPE</span></div>
    <p class="desc" data-i18n="tagline"></p>
    <div class="modes">
      <button class="mode t" id="btnModeT"><b>Tshobo Frappe</b><span data-i18n="modeTDesc"></span></button>
      <button class="mode p" id="btnModeP"><b>Poto Mokié</b><span data-i18n="modePDesc"></span></button>
    </div>
    <div class="btns">
      <button class="btn" id="btnHelp" data-i18n="howTo"></button>
      <button class="btn primary hidden" id="btnInstall" data-i18n="install"></button>
    </div>
    <div class="inapp hidden" id="inAppTip">
      <span data-i18n="inAppText"></span>
      <a class="btn primary hidden" id="btnOpenChrome" data-i18n="openChrome"></a>
    </div>
    <p class="small" data-i18n="keysLine"></p>
    <p class="small" data-i18n="mobileTip"></p>
  </div>
</div>

<!-- Help -->
<div class="overlay hidden" id="helpScreen">
  <div class="card help">
    <div id="helpBody"></div>
    <div class="btns"><button class="btn primary" id="btnHelpBack" data-i18n="gotIt"></button></div>
  </div>
</div>

<!-- Pause -->
<div class="overlay hidden" id="pauseScreen">
  <div class="card">
    <div class="langs"><button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="ln">LN</button></div>
    <h2 data-i18n="paused"></h2>
    <div class="btns">
      <button class="btn primary" id="btnResume" data-i18n="resume"></button>
      <button class="btn" id="btnPauseHelp" data-i18n="howTo"></button>
      <button class="btn" id="btnPauseRestart" data-i18n="restart"></button>
      <button class="btn" id="btnPauseMenu" data-i18n="mainMenu"></button>
    </div>
  </div>
</div>

<!-- Results -->
<div class="overlay hidden" id="resultScreen">
  <div class="card result-card">
    <div class="res-left">
      <div class="kicker" id="resKicker"></div>
      <h2 id="resTitle"></h2>
      <p class="desc" id="resDesc"></p>
      <div class="you-line" id="resYou"></div>
    </div>
    <div class="res-right">
      <table class="res-table" id="resTable"></table>
      <div class="btns">
        <button class="btn primary" id="btnNext"></button>
        <button class="btn" id="btnRestart"></button>
      </div>
      <p class="small" data-i18n="pressEnter"></p>
    </div>
  </div>
</div>

<!-- Turn the phone -->
<div class="overlay hidden" id="rotateTip">
  <div class="card">
    <div class="rotate-ico">📱</div>
    <h2 data-i18n="rotateTitle" style="font-size:28px"></h2>
    <p class="desc" data-i18n="rotateText"></p>
    <div class="btns"><button class="btn" id="btnPortraitOk" data-i18n="playPortrait"></button></div>
  </div>
</div>

<!-- Shown if the 3D game can't start (e.g. inside WhatsApp's file viewer). Plain text, no script needed. -->
<div class="overlay hidden" id="bootFail" style="z-index:50">
  <div class="card">
    <h2 style="font-size:28px">Ouvre dans Chrome</h2>
    <p class="desc">Ce navigateur ne peut pas lancer la 3D.</p>
    <p class="desc"><b>Open in Chrome:</b> this browser can't run the 3D game.</p>
    <p class="desc"><b>Fungola na Chrome:</b> navigateur oyo ekoki te kofungola lisano.</p>
    <div class="btns"><a class="btn primary hidden" id="bootChrome" style="text-decoration:none">Chrome ▶</a></div>
    <p class="small" id="bootFileTip">WhatsApp : ⋮ → Ouvrir avec → Chrome · Open with → Chrome</p>
  </div>
</div>

<script>
(function () {
  window.__tshoboBootFail = function () {
    var el = document.getElementById('bootFail'); if (!el) return;
    ['titleScreen', 'helpScreen', 'pauseScreen', 'resultScreen', 'rotateTip'].forEach(function (id) { var x = document.getElementById(id); if (x) x.classList.add('hidden'); });
    el.classList.remove('hidden');
    var isAndroid = /Android/i.test(navigator.userAgent), web = location.protocol === 'https:';
    if (isAndroid && web) {
      var a = document.getElementById('bootChrome');
      a.href = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end';
      a.classList.remove('hidden');
    }
    if (web) document.getElementById('bootFileTip').classList.add('hidden');
  };
  setTimeout(function () { if (!window.__tshoboReady) window.__tshoboBootFail(); }, 7000);
})();
</script>

<h2 style="text-align:center;font-size:30px">How to play</h2>
<h3>Tshobo Frappe. 4 players, every one for themselves, 5 rounds</h3>
<ul>
<li><b>Win the ball</b> by running into it, or <b>TACKLE</b> whoever has it.</li>
<li>With the ball you have three skills: <b>NUTMEG</b>. A low ball between someone's open legs. <b>FLICK</b>. Pops the ball up at their chest: if it hits their arms, that's a <b>handball</b>. <b>FEINT</b>. A step-over. Players often bite and waste their defence. Then nutmeg them!</li>
<li>Without the ball, <b>DEFEND</b> closes your legs and ducks at the same time. Watch for the "!" wind-up and the red warning, and press it just before the ball arrives.</li>
<li><b>Tshobo!</b> or <b>handball</b> = punishment: that player sprints to the safe spot (The Blue Wall or The Pole, shown each round) while everyone chases and <b>SLAPS</b> them. The runner can <b>DASH</b>.</li>
<li>Scoring: Tshobo / forced handball +1 · each slap you land +1 · reaching safety +2.</li>
</ul>
<h3>Poto Mokié. 3 v 3, small stone goals</h3>
<ul>
<li>You're on Blue, attacking the far goal. <b>SHOOT</b>, <b>PASS</b>, <b>FEINT</b>; without the ball <b>TACKLE</b> or <b>CALL</b> for a pass.</li>
<li>A goal must go between the two stones and stay low. No crossbar to argue about!</li>
<li>Life goes on in the street: cars, moto-taxis, goats, chickens and people pass through. Step aside. You'll get bumped (no harm, just a honk) and the ball bounces off them.</li>
<li>First to 5 goals, or most goals after 3 minutes.</li>
</ul>
<h3>Controls</h3>
<div class="keys">
<b>WASD / Arrows</b><span>Move (up = down the street)</span>
<b>J / Space</b><span>Red button: Nutmeg · Defend · Slap · Dash · Shoot · Tackle</span>
<b>K</b><span>Blue button: Feint · Tackle · Pass · Call</span>
<b>L</b><span>Purple button: Flick · Feint</span>

/* Pose a character. s: {run 0..1, phase, closed, duck, kick, feint, slap, cheer, wobble, sit} */
function poseChar(c, s) {

  const spread = s.closed ? 0.02 : 0.15 + 0.06 * (1 - s.run);
  if (s.sit) {
    c.hips.position.y = 0.47; c.legs[0].rotation.set(-1.45, 0, -0.08); c.legs[1].rotation.set(-1.45, 0, 0.08);
  } else {
    c.hips.position.y = 0.9 - (s.closed ? 0.1 : 0) - (s.duck ? 0.18 : 0) + Math.abs(Math.sin(s.phase)) * 0.04 * s.run;
    c.legs[0].rotation.set(sw * 0.9, 0, -spread);
    c.legs[1].rotation.set(-sw * 0.9, 0, spread);
  }
  c.torso.rotation.set(s.run * 0.15 + (s.duck ? 0.55 : 0), 0, 0);
  c.arms[0].rotation.set(-sw * 0.8, 0, -0.12); c.arms[1].rotation.set(sw * 0.8, 0, 0.12);
  if (s.kick > 0) c.legs[1].rotation.x = -1.3 * Math.sin((1 - s.kick) * Math.PI);
  if (s.feint > 0) { const k = Math.sin((1 - s.feint) * Math.PI); c.legs[1].rotation.z = 0.2 + 0.95 * k; c.legs[1].rotation.x = -0.5 * k; c.torso.rotation.z = -0.3 * k; }
  if (s.duck) { c.arms[0].rotation.set(0.4, 0, -0.05); c.arms[1].rotation.set(0.4, 0, 0.05); }
  if (s.cheer) { const w = Math.sin(s.phase * 3) * 0.3; c.arms[0].rotation.set(-2.7 + w, 0, -0.3); c.arms[1].rotation.set(-2.7 - w, 0, 0.3); }

function clearTraffic() { traffic.forEach(e => scene.remove(e.mesh)); traffic.length = 0; }
function updateTraffic(dt, interact) {
  if (interact) {
    G.nextTraffic -= dt;
    if (G.nextTraffic <= 0 && traffic.length < 2) {
      spawnTraffic(G.mode === 'poto' ? pickR(['car', 'moto', 'moto', 'goat', 'chickens', 'walker']) : pickR(['moto', 'goat', 'chickens', 'walker', 'car']));
      G.nextTraffic = G.mode === 'poto' ? rand(13, 22) : rand(16, 28);
    }
  } else if (G.state === 'title') {
    G.nextTraffic -= dt;
    if (G.nextTraffic <= 0 && traffic.length < 2) { spawnTraffic(pickR(['walker', 'goat', 'walker'])); G.nextTraffic = rand(6, 12); }
  }
  for (let i = traffic.length - 1; i >= 0; i--) {
    const e = traffic[i];
    if (e.dirZ !== undefined) {
      const sp = Math.abs(e.z) < 22 ? e.slow : e.fast;
      e.vz = e.dirZ * sp; e.z += e.vz * dt; e.mesh.rotation.y = e.dirZ > 0 ? 0 : Math.PI;
      if (e.type === 'walker') { e.phase += sp * dt * 2.2; poseChar(e.char, { run: 0.45, phase: e.phase }); }
      if (Math.abs(e.z) > 62) { scene.remove(e.mesh); traffic.splice(i, 1); continue; }
    } else {
      e.phase += dt;
      e.x += e.dirX * e.speed * dt;
      e.z += Math.sin(e.phase * 1.3) * 0.25 * dt;
      e.mesh.rotation.y = e.dirX > 0 ? Math.PI / 2 : -Math.PI / 2;
      if (e.type === 'goat') e.mesh.userData.legs.forEach((l, k) => { l.rotation.x = Math.sin(e.phase * 9 + k * Math.PI) * 0.4; });
      if (e.birds) e.birds.forEach((b, k) => { b.position.y = Math.abs(Math.sin(e.phase * 12 + k)) * 0.06; b.position.x = Math.sin(e.phase * 3 + k * 2) * 0.4; });
      if (Math.abs(e.x) > 7.6) { scene.remove(e.mesh); traffic.splice(i, 1); continue; }

}
function trafficCollide(e) {
  for (const p of players) {
    const dx = p.x - e.x, dz = p.z - e.z;
    if (e.hard) {
      if (Math.abs(dx) < e.w + 0.3 && Math.abs(dz) < e.l + 0.3) {
        const s = dx === 0 ? (p.x > 0 ? 1 : -1) : Math.sign(dx);
        p.x = e.x + s * (e.w + 0.32);
        if (p.bumpT <= 0) {
          p.stunT = Math.max(p.stunT, 0.6); p.bumpT = 1.5; Sound.horn();
          popAt(p, 'BEEP BEEP!', 'small');
          if (ball.holder === p) { ball.holder = null; ball.vx = s * 3; ball.vz = e.vz * 0.6; ball.vy = 1.5; }
        }
      }
    } else {
      const d = Math.hypot(dx, dz), r = e.w + 0.3;
      if (d < r && d > 0.001) { p.x = e.x + dx / d * r; p.z = e.z + dz / d * r; }
    }

  if (!ball.holder) {
    const dx = ball.x - e.x, dz = ball.z - e.z;

      const s = dx === 0 ? 1 : Math.sign(dx);
      if (e.hard) { ball.x = e.x + s * (e.w + 0.15); ball.vx = s * 4.5; ball.vz = (e.vz || 0) * 0.8; ball.vy = 2; }
      else { const d = Math.hypot(dx, dz) || 1; ball.vx = dx / d * 3.5; ball.vz = dz / d * 3.5; ball.vy = 1.6; ball.x = e.x + dx / d * (e.w + 0.14); ball.z = e.z + dz / d * (e.w + 0.14); }
      ball.kicker = null;
      if (Math.random() < 0.5) popup(ball.x, 1.2, ball.z, e.type === 'goat' ? 'Mééé!' : e.type === 'chickens' ? 'Bwak!' : 'BONG!', 'small');
      if (e.type === 'goat') Sound.bleat(); else if (e.type === 'chickens') Sound.cluck(); else Sound.block();
    }
  }
}

/* ----- Poto Mokié ----- */
const FORM = [[0, 1.2], [-3.2, 4.5], [3.2, 6]]; // [x, depth into own half] per team slot
function kickoff(team) {
  G.kickTeam = team; G.warn = null;
  for (const p of players) {
    resetPlayer(p);
    const slot = p.id % 3, dir = p.team === 0 ? -1 : 1;
    let depth = FORM[slot][1];
    if (slot === 0) depth = p.team === team ? 0.45 : 2.4;
    p.x = FORM[slot][0]; p.z = -dir * depth; p.face = p.team === 0 ? Math.PI : 0;
  }
  resetBall(0, 0);
  const taker = players.find(p => p.team === team && p.id % 3 === 0);
  takeBall(taker, true);
  G.state = 'intro'; G.phaseT = 1.8;
  banner(t('kickoff'), t(team === 0 ? 'blueStart' : 'orangeStart'), '#ffffff', 1.6);
  showScreen(null);
}
function scoreGoal(team) {
  G.score[team]++; G.lastGoalTeam = team; G.state = 'goal'; G.phaseT = 2.6;
  const sc = ball.kicker;
  banner(t(team === 0 ? 'goalBlue' : 'goalOrange'), (sc ? t('goalBy', { A: capName(sc), a: nm(sc) }) + ' ' : '') + `${G.score[0]} – ${G.score[1]}`, team === 0 ? '#5aa9ff' : '#ff9d4d', 2.3);
  players.forEach(p => { if (p.team === team) p.cheerT = 2.4; });

  ball.vx *= 0.3; ball.vz *= 0.3;
}
function showPotoFinal() {
  G.state = 'final';
  const [b, o] = G.score;
  $('resKicker').textContent = t('potoKicker');
  $('resTitle').textContent = b > o ? t('blueWins') : o > b ? t('orangeWins') : t('draw');
  $('resTitle').style.color = b > o ? '#5aa9ff' : o > b ? '#ff9d4d' : '#ffffff';
  $('resDesc').textContent = t('potoDesc', { b, o });
  const y = $('resYou'); y.textContent = b > o ? t('potoWin') : o > b ? t('potoLose') : t('potoDraw'); y.className = 'you-line ' + (b > o ? 'good' : o > b ? 'bad' : '');
  $('resTable').innerHTML = '';
  $('btnNext').textContent = t('playAgain'); $('btnRestart').textContent = t('mainMenu');
  showScreen('resultScreen');
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
const fwd = p => [Math.sin(p.face), Math.cos(p.face)];
const opponents = p => players.filter(q => q !== p && (G.mode === 'tshobo' || q.team !== p.team));
function takeBall(p, silent) {
  ball.holder = p; ball.kicker = null; ball.kind = null; ball.vx = ball.vy = ball.vz = 0; ball.y = R_BALL;
  p.ai.holdT = 0; p.ai.actDelay = G.mode === 'tshobo' ? rand(0.9, 1.8) : rand(0.35, 0.9); p.ai.target = null; p.ai.passTo = null;
  if (!silent) Sound.touch();
}
function assistTarget(p, maxD, cone) {
  const [fx, fz] = fwd(p); let best = null, bs = Infinity;
  for (const q of opponents(p)) {
    const dx = q.x - p.x, dz = q.z - p.z, d = Math.hypot(dx, dz);
    if (d < 0.6 || d > maxD) continue;
    const ang = Math.acos(clamp((fx * dx + fz * dz) / d, -1, 1));
    if (ang > cone) continue;
    const s = ang * 3 + d * 0.4;
    if (s < bs) { bs = s; best = q; }
  }
  return best;
}
function release(p) { ball.holder = null; ball.kicker = p; ball.kickT = 0; ball.contacted = []; p.noPickupT = 0.35; p.kickAnim = 0.25; }
function kickAt(p, target, kind) {
  if (ball.holder !== p) return;
  const spd = kind === 'air' ? 7 : 8;
  let tx, tz;
  if (target) {
    const d = dist(p, target), t = d / spd;
    tx = target.x + target.vx * t * 0.6; tz = target.z + target.vz * t * 0.6;
    const err = p.human ? 0.03 : 0.05 + d * 0.018;
    tx += randn() * err; tz += randn() * err;
  } else { const [fx, fz] = fwd(p); tx = ball.x + fx * 5; tz = ball.z + fz * 5; }
  const dx = tx - ball.x, dz = tz - ball.z, d = Math.hypot(dx, dz) || 1;
  release(p);
  ball.kind = kind; ball.vx = dx / d * spd; ball.vz = dz / d * spd; ball.y = R_BALL;
  if (kind === 'air') { const t = Math.max(0.15, d / spd); ball.vy = (1.15 - R_BALL + 0.5 * GRAV * t * t) / t; } else ball.vy = 0;
  p.face = Math.atan2(dx, dz);
  Sound.kick();
  if (target) {
    const d = Math.hypot(target.x - ball.x, target.z - ball.z);
    if (target.human) G.warn = { kind, t: 0.9 };
    else if (target.defendCd <= 0 && Math.random() < READ) target.ai.defendIn = Math.max(0, d / spd - rand(0.15, 0.35)); // a good read is timed to the ball
  }
}
// AI attackers wind up first so the human has time to read the move
function aiAttack(p, kind) {
  const t = p.ai.target;
  p.pending = { kind, t: 0.32, target: t };
  if (t && t.human) G.warn = { kind, t: 1.0, pre: true };
}
function feint(p) {
  if (p.feintCd > 0) return;
  p.feintT = 0.45; p.feintCd = 0.9; Sound.swish();
  const [fx, fz] = fwd(p);
  for (const q of opponents(p)) {
    if (q.human) continue;
    const dx = q.x - p.x, dz = q.z - p.z, d = Math.hypot(dx, dz);
    if (d > (G.mode === 'poto' ? 2.8 : 4.2) || d < 0.3) continue;
    if ((fx * dx + fz * dz) / d < 0.45) continue;
    if (G.mode === 'tshobo') {
      if (q.defendCd <= 0 && Math.random() < BITE) { q.defendT = 0.45; q.defendCd = 1.6; popAt(q, t('bitten'), '', 0.9); }
      else popAt(q, t('notFooled'), 'small', 0.7);
    } else if (Math.random() < BITE) { q.stunT = 0.75; popAt(q, t('bitten'), '', 0.9); }
  }
}
function defend(p) { if (p.defendCd > 0) return; p.defendT = 0.5; p.defendCd = 1.1; }
function tackle(p) {
  if (p.tackleCd > 0 || p.stunT > 0) return;
  let dx = ball.x - p.x, dz = ball.z - p.z; const d = Math.hypot(dx, dz);
  if (d < 2.2 && d > 0.01) { dx /= d; dz /= d; } else { [dx, dz] = fwd(p); }
  p.tdx = dx; p.tdz = dz; p.tackleT = 0.22; p.tackleCd = 0.9; p.tackleDone = false; Sound.swish();
}
function dash(p, mx, mz) {
  if (p.dashCd > 0 || p.stunT > 0) return;
  let l = Math.hypot(mx, mz); if (l < 0.1) { [mx, mz] = fwd(p); l = 1; }
  p.ddx = mx / l; p.ddz = mz / l; p.dashT = 0.32; p.dashCd = 1.4; Sound.dash();
}
function shoot(p) {
  if (ball.holder !== p) return;
  const dir = p.team === 0 ? -1 : 1, gz = dir * GOAL_Z, d = Math.hypot(p.x, gz - p.z);
  let tx = p.human && Math.abs(p.mx) > 0.2 ? Math.sign(p.mx) * 0.5 : pickR([-0.5, 0.5, -0.2, 0.2]);
  const err = p.human ? 0.12 + d * 0.015 : 0.3 + d * 0.03;
  tx += randn() * err;
  const dx = tx - ball.x, dz = gz - ball.z, l = Math.hypot(dx, dz) || 1;
  release(p); ball.kind = 'shot';
  ball.vx = dx / l * 13.5; ball.vz = dz / l * 13.5; ball.vy = 1.2 + Math.random() * 0.8;
  p.face = Math.atan2(dx, dz); Sound.kick();
}
function bestPassTarget(p) {
  const dir = p.team === 0 ? -1 : 1; let best = null, bs = -Infinity;
  for (const q of players) {
    if (q === p || q.team !== p.team) continue;
    const d = dist(p, q); if (d < 1.8 || d > 15) continue;
    let blocked = false, nearOpp = 9;
    for (const o of players) {
      if (o.team === p.team) continue;
      if (segDist(p.x, p.z, q.x, q.z, o.x, o.z) < 0.7) blocked = true;
      nearOpp = Math.min(nearOpp, dist(o, q));
    }
    if (blocked) continue;
    const s = dir * (q.z - p.z) * 0.5 + Math.min(nearOpp, 4) - d * 0.12 + (q.human ? 0.5 : 0);
    if (s > bs) { bs = s; best = q; }
  }

}
function pass(p, q) {
  if (ball.holder !== p) return;
  if (!q) { q = players.filter(x => x !== p && x.team === p.team).sort((a, b) => dist(p, a) - dist(p, b))[0]; if (!q) return; }
  const d = dist(p, q), spd = clamp(4 + d * 1.1, 6, 12), t = d / spd;
  const tx = q.x + q.vx * t * 0.8, tz = q.z + q.vz * t * 0.8;
  const dx = tx - ball.x, dz = tz - ball.z, l = Math.hypot(dx, dz) || 1;
  release(p); ball.kind = 'pass';
  ball.vx = dx / l * spd; ball.vz = dz / l * spd; ball.vy = d > 8 ? 2.6 : 0.3;
  p.face = Math.atan2(dx, dz); Sound.kick();
}
function callForPass(p) {
  const h = ball.holder;
  if (h && h.team === p.team && h !== p) { h.ai.passTo = p; h.ai.actDelay = Math.min(h.ai.actDelay, 0.15); popAt(p, t('passCall'), 'small', 0.8); }
  else popAt(p, t('hey'), 'small', 0.6);
}

/* contextual action labels for the human: [A, B, C] */
function actionsFor() {
  if (!human) return [null, null, null];
  if (G.mode === 'tshobo') {
    if (G.state === 'play') return ball.holder === human ? ['NUTMEG', 'FEINT', 'FLICK'] : ['DEFEND', 'TACKLE', null];
    if (G.state === 'chase') return G.runner === human ? ['DASH', null, null] : ['SLAP', null, null];
  } else if (G.state === 'play') return ball.holder === human ? ['SHOOT', 'PASS', 'FEINT'] : ['TACKLE', 'CALL', null];
  return [null, null, null];
}
function doAction(i) {
  const a = actionsFor()[i], p = human;
  if (!a) return;
  switch (a) {
    case 'NUTMEG': kickAt(p, assistTarget(p, 4.6, 0.85), 'ground'); break;
    case 'FLICK': kickAt(p, assistTarget(p, 4.6, 0.85), 'air'); break;
    case 'FEINT': feint(p); break;
    case 'DEFEND': defend(p); break;
    case 'TACKLE': tackle(p); break;
    case 'DASH': dash(p, p.mx, p.mz); break;
    case 'SLAP': slap(p); break;
    case 'SHOOT': shoot(p); break;
    case 'PASS': pass(p, bestPassTarget(p)); break;
    case 'CALL': callForPass(p); break;
  }
}

/* =====================================================================
   AI
   ===================================================================== */
function seek(p, x, z, slow) {
  const dx = x - p.x, dz = z - p.z, d = Math.hypot(dx, dz);
  if (d < 0.08) { p.mx = p.mz = 0; return; }
  const f = slow > 0 ? Math.min(1, d / slow) : 1;
  p.mx = dx / d * f; p.mz = dz / d * f;
}
function nearestToBall(list) { let b = null, bd = Infinity; for (const q of list) { const d = Math.hypot(q.x - ball.x, q.z - ball.z); if (d < bd) { bd = d; b = q; } } return b; }

  for (const e of traffic) {
    if (!e.hard) continue;
    const ahead = (p.z - e.z) * e.dirZ;
    if (ahead > -2 && ahead < 11 && Math.abs(p.x - e.x) < e.w + 1.1) {
      const s = p.x === e.x ? (p.x > 0 ? 1 : -1) : Math.sign(p.x - e.x);
      p.mx = s; p.mz = 0; return true;
    }
  }
  return false;
}
function aiTshobo(p, dt) {
  const ai = p.ai, h = ball.holder;

    if (h === p) {
      if (p.pending) return;
      ai.holdT += dt; ai.retargetT -= dt; ai.actDelay -= dt;
      if (!ai.target || ai.retargetT <= 0) {
        let best = null, bs = Infinity;
        for (const q of players) { if (q === p) continue; const s = dist(p, q) + Math.random() * 2.5 - (q.human ? 1 : 0); if (s < bs) { bs = s; best = q; } }
        ai.target = best; ai.retargetT = rand(1.2, 2.2);
      }
      const t = ai.target, dx = t.x - p.x, dz = t.z - p.z, d = Math.hypot(dx, dz) || 1, ux = dx / d, uz = dz / d;
      if (d > 3.4) { p.mx = ux * 0.75; p.mz = uz * 0.75; }
      else if (d < 2.1) { p.mx = -ux * 0.7; p.mz = -uz * 0.7; }
      else { const s = Math.sin(G.time * 1.8 + ai.seed) * 0.4; p.mx = -uz * s; p.mz = ux * s; }
      p.aimAt = t;
      const facing = Math.abs(angDiff(p.face, Math.atan2(dx, dz)));
      const pressured = players.some(q => q !== p && dist(q, p) < 1.1);
      if ((ai.actDelay <= 0 && facing < 0.35 && d > 1.9 && d < 4.3) || (pressured && ai.holdT > 0.8 && facing < 0.6)) {
        if (t.defendCd > 0.3) aiAttack(p, Math.random() < 0.75 ? 'ground' : 'air');      // defender just bit — strike
        else { const r = Math.random(); if (r < 0.38 && p.feintCd <= 0) feint(p); else aiAttack(p, r < 0.8 ? 'ground' : 'air'); }
        ai.actDelay = rand(0.45, 1.0);
      } else if (ai.holdT > 4.5) { aiAttack(p, 'ground'); ai.holdT = 0; }

    if (p.pending) { p.char.arms[0].rotation.x = 0.6; p.char.arms[1].rotation.x = 0.6; p.char.legs[1].rotation.x = 0.5; }
    p.char.g.position.set(p.x, p.cheerT > 0 && sp < 1 ? Math.abs(Math.sin(G.time * 9 + p.id)) * 0.12 : 0, p.z);
    p.char.g.rotation.y = p.face;
  }
  for (const s of spectators) {
    const cheer = G.cheerT > 0;
    s.ph += dt * (cheer ? 9 : 1.5);
    poseChar(s.c, { run: 0, phase: s.ph, cheer, sit: s.sit });
    s.c.g.position.y = cheer && !s.sit ? Math.abs(Math.sin(s.ph)) * 0.12 : 0;
  }
  ball.mesh.position.set(ball.x, ball.y, ball.z);
  ball.shadow.position.set(ball.x, 0.016, ball.z);
  const sc = Math.max(0.4, 1 - ball.y * 0.3); ball.shadow.scale.set(sc, sc, sc);
  if (human) { humanRing.visible = true; humanRing.position.set(human.x, 0.03, human.z); } else humanRing.visible = false;
  if (ball.holder) { holderRing.visible = true; holderRing.position.set(ball.holder.x, 0.025, ball.holder.z); holderRing.material.color.set(ball.holder.human ? '#ffd23f' : '#ffffff'); } else holderRing.visible = false;
  for (const z of ZONES) {
    if (!z.group.visible) continue;
    z.arrow.position.y = 3.2 + Math.sin(G.time * 3) * 0.25; z.arrow.rotation.y += dt * 2;
    if (z === G.zone && G.state === 'chase') z.ringMat.opacity = 0.6 + 0.4 * Math.sin(G.time * 8);
  }
}

/* ---------- camera ---------- */
const camPos = new THREE.Vector3(0, 6, 14), camLook = new THREE.Vector3(0, 1, -8);
const _tp = new THREE.Vector3(), _tl = new THREE.Vector3();
function updateCamera(rdt) {
  const port = view.w / view.h < 1;
  if (G.state === 'title' || !human) {
    _tp.set(Math.sin(G.time * 0.15) * 2.5, 4.2, 12 + Math.sin(G.time * 0.1) * 3);
    _tl.set(0, 1.2, -8);
  } else {
    let fx, fz, d = 1;
    if (G.mode === 'tshobo') {
      if (G.state === 'intro') { fx = G.zone.x * 0.3; fz = G.zone.z * 0.5; d = 1.45; }   // establish players + today's safe spot
      else if ((G.state === 'chase' || G.state === 'outcome') && G.runner) { fx = (G.runner.x + G.zone.x) / 2; fz = (G.runner.z + G.zone.z) / 2; d = 0.95 + Math.hypot(G.runner.x - G.zone.x, G.runner.z - G.zone.z) / 26; }
      else if (G.state === 'punish' && G.runner) { fx = G.runner.x; fz = G.runner.z; d = 0.5; }
      else { fx = (human.x + ball.x) / 2; fz = (human.z + ball.z) / 2; d = 0.95 + Math.max(0, Math.hypot(human.x - ball.x, human.z - ball.z) - 3) / 14; }
    } else {
      fx = lerp(ball.x, human.x, 0.25); fz = lerp(ball.z, human.z, 0.25);
      d = G.state === 'intro' ? 1.25 : G.state === 'goal' ? 0.85 : 1.08;
    }
    if (port) d *= 1.5;
    fz = clamp(fz, -BOUNDS[G.mode].z, BOUNDS[G.mode].z);
    _tp.set(fx * 0.45, 7.2 * d + 0.6, fz + 9.8 * d);
    _tl.set(fx * 0.75, 0.7, fz - 2.2);
  }
  const k = 1 - Math.exp(-(G.state === 'punish' ? 6 : 3.4) * rdt);
  camPos.lerp(_tp, k); camLook.lerp(_tl, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
}

/* ---------- labels & popups (DOM, projected) ---------- */
const _v = new THREE.Vector3();
function project(x, y, z) {
  _v.set(x, y, z).project(camera);
  return { x: (_v.x + 1) / 2 * view.w, y: (1 - _v.y) / 2 * view.h, ok: _v.z < 1 && _v.z > -1 };
}
function updateLabels(rdt) {
  for (const p of players) {
    let html = p.human ? t('meTag') : p.name;
    if (G.mode === 'tshobo' && p === G.runner && (G.state === 'chase' || G.state === 'punish')) html = `<span class="st">${t('runner')}</span>` + html;
    if (p.pending) html = '<span class="bang">!</span>' + html;
    if (p.human && G.warn && G.state === 'play') html = `<span class="warn">${G.warn.kind === 'air' ? t('duck') : t('closeLegs')}</span>` + html;
    if (html !== p.labelKey) { p.label.innerHTML = html; p.labelKey = html; }
    const s = project(p.x, 2.05, p.z);
    p.label.style.display = s.ok ? '' : 'none';
    p.label.style.transform = `translate(${s.x}px,${s.y}px) translate(-50%,-100%)`;
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const o = pops[i]; o.t += rdt;
    if (o.t >= o.dur) { o.el.remove(); pops.splice(i, 1); continue; }
    const s = project(o.x, o.y, o.z);
    const sc = o.t < 0.15 ? 0.5 + o.t / 0.15 * 0.6 : o.t < 0.25 ? 1.1 - (o.t - 0.15) : 1;
    o.el.style.opacity = o.t > o.dur - 0.3 ? (o.dur - o.t) / 0.3 : 1;
    o.el.style.display = s.ok ? '' : 'none';
    o.el.style.transform = `translate(${s.x}px,${s.y - o.t * 40}px) translate(-50%,-50%) scale(${sc})`;
  }
}

/* ---------- HUD ---------- */
const hudCache = {};
function setText(id, t) { if (hudCache[id] !== t) { hudCache[id] = t; $(id).textContent = t; } }
function setHTML(id, h) { if (hudCache[id] !== h) { hudCache[id] = h; $(id).innerHTML = h; } }
function updateHUD() {
  if (G.state === 'title') return;
  const A = touchUI ? t('redBtn') : 'J';
  let obj = '', hint = '', timer = '', warn = false;
  if (G.mode === 'tshobo') {
    setText('hudRound', t('hudRoundT', { n: G.round, t: G.rounds }));
    const ph = { intro: 'ph_kickoff', play: 'ph_live', punish: G.cause === 'handball' ? 'ph_hand' : 'ph_tshobo', chase: 'ph_chase', outcome: 'ph_safe', result: 'ph_result', final: 'ph_full' }[G.state];
    setText('hudPhase', ph ? t(ph) : '');
    const r = G.runner, h = ball.holder;
    if (G.state === 'intro') { obj = t('introObj', { z: G.zone.name }); hint = t('introHint'); }
    else if (G.state === 'play') {
      if (h === human) { const tg = assistTarget(human, 4.6, 0.85); obj = tg ? t('nutObj', { a: tg.name }) : t('faceObj'); hint = t('haveHint'); }
      else if (h) { obj = t('otherHasObj', { a: h.name }); hint = t('defendHint'); }
      else { obj = t('looseObj'); hint = t('looseHint'); }
      if (G.warn) { warn = true; hint = t(G.warn.kind === 'air' ? 'warnAir' : 'warnGround', { k: A }); }
    } else if (G.state === 'punish') obj = G.cause === 'nutmeg' ? t('tshoboSub', { A: capName(G.culprit), a: nm(G.culprit), b: nm(r) }) : t('handSub', { A: capName(r), a: nm(r) });
    else if (G.state === 'chase') {
      timer = t('chaseTimer', { s: Math.max(0, Math.ceil(CHASE_TIME - G.chaseT)), n: G.slaps });
      if (r === human) { obj = t('runObj', { z: G.zone.name }); hint = t('runHint', { k: A }); }
      else { obj = t('slapObj', { a: r.name, z: G.zone.name }); hint = t('slapHint', { k: A }); }
    } else if (G.state === 'outcome') obj = t('safe');
    else if (G.state === 'result') obj = t('roundOver'); else if (G.state === 'final') obj = t('ph_full');
    setHTML('hudScores', players.map(p => `<span class="chip${p.human ? ' me' : ''}"><i style="background:${p.shirt}"></i>${capName(p)} ${p.score}</span>`).join(''));
  } else {
    setText('hudRound', t('hudRoundP'));
    const ph = { intro: 'ph_kickoff', play: 'ph_live', goal: 'ph_goal', final: 'ph_full' }[G.state];
    setText('hudPhase', ph ? t(ph) : '');
    const h = ball.holder;
    if (G.state === 'play') {
      if (h === human) { obj = t('attackObj'); hint = t('attackHint'); }
      else if (h && h.team === 0) { obj = t('mateObj', { a: h.name }); hint = t('mateHint'); }
      else if (h) { obj = t('winBackObj', { a: h.name }); hint = t('winBackHint'); }
      else { obj = t('looseObjP'); hint = t('looseHintP'); }
      if (traffic.some(e => e.hard && Math.abs(e.z) < 24)) hint = t('trafficHint');
    } else if (G.state === 'intro') obj = t('kickoff'); else if (G.state === 'goal') obj = t('goalObj'); else if (G.state === 'final') obj = t('ph_full');
    const mm = Math.floor(G.clock / 60), ss = Math.floor(G.clock % 60);
    timer = t('clock', { m: mm, ss: String(ss).padStart(2, '0'), n: POTO_GOALS });
    setHTML('hudScores', `<div class="scoreboard"><span class="b">${t('blue')} ${G.score[0]}</span><span class="c">–</span><span class="o">${G.score[1]} ${t('orange')}</span></div>`);
  }
  if (touchUI) hint = hint.replace(/ \((J|K|L)\)/g, '');
  setText('hudObjective', obj); setText('hudTimer', timer); setText('hint', hint);
  $('hint').style.visibility = hint ? 'visible' : 'hidden';
  $('hint').classList.toggle('warn', warn);
  const acts = actionsFor();
  ['btnA', 'btnB', 'btnC'].forEach((id, i) => {
    const b = $(id), a = acts[i];
    b.style.visibility = a ? 'visible' : 'hidden';
    if (a) { const span = b.firstChild, lbl = t('act_' + a); if (span.textContent !== lbl) span.textContent = lbl; }
  });
}

/* ---------- language switching ---------- */
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('helpBody').innerHTML = t('helpHTML');
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  for (const k in hudCache) delete hudCache[k];
  players.forEach(p => { p.labelKey = ''; });
}
function setLang(l) {
  if (!I18N[l]) return;
  LANG = l;
  try { localStorage.setItem('tshobo3d-lang', l); } catch (e) { /* ignore */ }
  applyLang();
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { Sound.ensure(); Sound.click(); setLang(b.dataset.lang); }));

/* ---------- full screen + landscape on phones ---------- */
const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function lockLandscape() {
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* not supported */ }
}
function goFullscreen() {
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  if (isFullscreen()) { lockLandscape(); return; }
  try {
    const pr = req.call(el, { navigationUI: 'hide' });
    if (pr && pr.then) pr.then(lockLandscape).catch(() => {}); else lockLandscape();
  } catch (e) { /* refused */ }
}
function toggleFullscreen() {
  if (isFullscreen()) { const ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) ex.call(document); }
  else goFullscreen();
}
document.querySelectorAll('.fs-btn').forEach(b => {
  if (!fsSupported) b.classList.add('hidden');
  b.addEventListener('click', () => { Sound.ensure(); toggleFullscreen(); });
});
// On phones, show a "turn your phone" card while in portrait during a match.
function checkRotate() {
  const need = touchUI && isActive() && view.h > view.w && !G.portraitOk && $('pauseScreen').classList.contains('hidden');
  $('rotateTip').classList.toggle('hidden', !need);
  if (need && !G.paused) { G.paused = true; G.rotPaused = true; }
  if (!need && G.rotPaused) { G.rotPaused = false; G.paused = false; }
}
$('btnPortraitOk').addEventListener('click', () => { Sound.ensure(); G.portraitOk = true; checkRotate(); });

/* ---------- loop ---------- */
function resize() {
  view.w = Math.max(1, window.innerWidth); view.h = Math.max(1, window.innerHeight);
  renderer.setSize(view.w, view.h, false);
  camera.aspect = view.w / view.h;
  camera.fov = camera.aspect < 1 ? 62 : 52;
  camera.updateProjectionMatrix();
  stickHome();
  if (typeof checkRotate === 'function' && players.length) checkRotate();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - last) / 1000; last = now;
  if (!(rdt > 0)) rdt = 0;
  rdt = Math.min(rdt, 1 / 30);
  try {
    if (!G.paused) update(rdt);
    updateCamera(G.paused ? 0 : rdt);
    renderer.render(scene, camera);
    window.__tshoboReady = true;
    updateLabels(G.paused ? 0 : rdt);
    updateHUD();
  } catch (err) { console.error(err); }
}
/* ---------- website extras: open-in-Chrome tip, install button, offline cache ---------- */
const UA = navigator.userAgent || '';
const IS_ANDROID = /Android/i.test(UA);
const IN_APP = /; wv\)|WhatsApp|FBAN|FBAV|Instagram|Line\//i.test(UA) || location.protocol === 'content:';
const ON_WEB = location.protocol === 'https:';
if (IN_APP) {
  $('inAppTip').classList.remove('hidden');
  if (IS_ANDROID && ON_WEB) {
    const a = $('btnOpenChrome');
    a.href = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end';
    a.classList.remove('hidden');
  }
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('btnInstall').classList.remove('hidden'); });
$('btnInstall').addEventListener('click', () => {
  Sound.ensure(); Sound.click();
  if (!installEvt) return;
  installEvt.prompt();
  installEvt.userChoice.finally(() => { installEvt = null; $('btnInstall').classList.add('hidden'); });
});
window.addEventListener('appinstalled', () => $('btnInstall').classList.add('hidden'));
if ('serviceWorker' in navigator && (ON_WEB || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* offline cache is optional */ });
}

applyLang();
resize();
goTitle();
requestAnimationFrame(frame);
window.__tg = { G, get players() { return players; }, ball, traffic, startMode, spawnTraffic,
  step(n) { for (let i = 0; i < n; i++) { update(1 / 60); updateLabels(1 / 60); } } };  // debug: fast-forward without rendering
})();

</script>
